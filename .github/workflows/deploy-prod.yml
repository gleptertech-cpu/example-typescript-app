name: Deploy (prod)

# Production only deploys here, on merge to main - i.e. a PR actually
# being merged, not just any push. Dev/staging deploy separately and much
# more often, from feature/fix/patch branches directly (deploy-non-prod.yml).
on:
  push:
    branches: [main]
    paths-ignore:
      - "terraform/**"

permissions:
  id-token: write # required for OIDC -> AWS role assumption, no static keys
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECS_CLUSTER: example-typescript-app-prod
  ECS_SERVICE: example-typescript-app-prod
  ECR_REPOSITORY: example-typescript-app-prod

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # NOTE: assumes an IAM role already exists with a trust policy for
      # GitHub's OIDC provider, scoped to this repo. That one-time IAM setup
      # isn't included here - see PROPOSAL.md. Deliberately not using static
      # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY secrets.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<ACCOUNT_ID>:role/github-actions-example-typescript-app
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and push image tagged with the commit SHA
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<ACCOUNT_ID>:role/github-actions-example-typescript-app
          aws-region: ${{ env.AWS_REGION }}

      # Registers a new task definition revision pointing at the new image,
      # then updates the service to it. ECS's deployment circuit breaker
      # (configured in Terraform) rolls back automatically if the new
      # revision's tasks fail their ALB health check.
      - name: Render new task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_SERVICE" \
            --query taskDefinition \
            > task-definition.json

      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: render
        with:
          task-definition: task-definition.json
          container-name: example-typescript-app
          image: ${{ needs.build-and-push.outputs.image }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
